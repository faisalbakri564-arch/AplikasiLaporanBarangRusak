<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - E-Report Guardian</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        .login-card h2 { color: #f26522; margin-bottom: 5px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #f26522; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #d9561a; }
        .error-msg { color: red; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>E-Report Guardian</h2>
    <p>Login Toko atau Area Manager</p>

    <form action="/proses-login" method="POST">
        <input type="text" name="username" placeholder="Masukkan Kode Toko / Username AM" required>
        <input type="password" name="password" placeholder="Password (Kosongkan jika Toko)">
        <button type="submit">Masuk</button>
    </form>
</div>

</body>
</html>
