<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Laporan - Store</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; display: flex; min-height: 100vh; }

        /* Sidebar Desktop */
        .sidebar { width: 250px; background: #2c3e50; color: white; display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .sidebar h3 { color: #f26522; margin: 0 0 8px 0; }
        .sidebar p { margin: 0 0 12px 0; font-size: 14px; }
        .sidebar hr { border: none; border-top: 1px solid #444; width: 100%; margin: 0 0 12px 0; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
        .sidebar a { color: white; text-decoration: none; padding: 11px 14px; border-radius: 4px; display: block; font-weight: bold; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #f26522; }
        .btn-logout { margin-top: auto; background: #d9534f; text-align: center; }

        /* Konten Utama */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        .card { background: white; padding: 22px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 620px; margin: 0 auto; }
        .card h2 { margin-top: 0; font-size: 20px; color: #222; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 14px; }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }

        /* Tombol Pilih Kamera / Galeri */
        .photo-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-camera, .btn-gallery {
            flex: 1 1 160px; color: white; padding: 11px 12px; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 14px; text-align: center;
            margin: 0; user-select: none; display: inline-block;
        }
        .btn-camera { background: #2c3e50; }
        .btn-gallery { background: #6c757d; }
        .btn-web-cam {
            margin-top: 8px; background: #17a2b8; color: white; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%;
        }
        .sr-only-input {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        .file-status { margin-top: 6px; font-size: 13px; color: #555; }
        #previewFoto { display: none; margin-top: 8px; max-width: 150px; max-height: 150px; border-radius: 6px; border: 1px solid #ccc; object-fit: cover; }

        /* Area Kamera Web untuk Foto Barang */
        #photo-cam-container {
            display: none; margin-top: 10px; padding: 10px; border: 2px dashed #17a2b8;
            border-radius: 6px; background: #f4fbfd; width: 100%;
        }
        #photoVideo { width: 100%; border-radius: 4px; background: #000; display: block; }
        .photo-cam-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-snap { flex: 1; background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-close-cam { flex: 1; background: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .input-action-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .input-action-row input { flex: 1 1 200px; }
        .btn-cek { background: #4CAF50; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-scan { background: #007bff; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-stop-scan { background: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
        .btn-submit { background: #f26522; color: white; border: none; padding: 13px; width: 100%; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { background: #999; cursor: not-allowed; }
        .readonly-bg { background-color: #e9ecef; color: #555; }
        .hint { font-size: 12px; color: #666; margin-top: 5px; display: block; line-height: 1.4; }

        /* Area Kamera Scanner Barcode */
        #scanner-container { display: none; margin-top: 12px; padding: 10px; border: 2px dashed #007bff; border-radius: 6px; background: #f8fbff; width: 100%; }
        #reader { width: 100%; min-height: 240px; overflow: hidden; border-radius: 4px; background: #000; }
        #reader video { width: 100% !important; height: auto !important; object-fit: cover; }

        /* Tampilan Responsif Khusus HP */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 14px 16px; }
            .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
            .sidebar h3 { margin: 0; font-size: 18px; }
            .sidebar p { margin: 0; font-size: 13px; }
            .sidebar-nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
            .sidebar-nav a { flex: 1 1 auto; text-align: center; padding: 9px 8px; font-size: 13px; }
            .btn-logout { margin-top: 8px; width: 100%; padding: 9px; font-size: 13px; }
            .main-content { padding: 12px; }
            .card { padding: 16px; }
            .btn-scan, .btn-cek { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h3>E-Report Toko</h3>
        <p>Kode Toko: <strong th:text="${storeCode}"></strong></p>
    </div>
    <hr>
    <div class="sidebar-nav">
        <a href="/form-laporan" class="active">Input Laporan</a>
        <a href="/summary-laporan">Summary Laporan</a>
        <a href="/berita-acara/download-template">Berita Acara</a>
    </div>
    <a href="/logout" class="btn-logout">Logout</a>
</div>

<div class="main-content">
    <div class="card">
        <h2>Form Pengajuan Barang Rusak</h2>
        <form action="/submit-laporan" method="POST" enctype="multipart/form-data" onsubmit="return validateAndDisableSubmit()">
            <div class="form-group">
                <label>1. Foto Barang Rusak</label>
                <div class="photo-btn-group">
                    <!-- Input Kamera Statis (Dipicu langsung lewat label agar Android buka Kamera) -->
                    <label for="kameraInput" class="btn-camera">📷 Ambil Foto (Kamera)</label>
                    <input type="file" id="kameraInput" accept="image/*" capture="environment" class="sr-only-input" onchange="handleFileSelect(this, 'kamera')">

                    <!-- Input Galeri Statis -->
                    <label for="galeriInput" class="btn-gallery">🖼️ Pilih dari Galeri</label>
                    <input type="file" id="galeriInput" accept="image/*" class="sr-only-input" onchange="handleFileSelect(this, 'galeri')">
                </div>

                <!-- Cadangan Kamera Web Langsung jika Android tetap memaksa buka Galeri -->
                <button type="button" class="btn-web-cam" onclick="openWebCamera()">🎥 Jepret Langsung via Kamera Browser</button>

                <div id="photo-cam-container">
                    <video id="photoVideo" autoplay playsinline></video>
                    <canvas id="photoCanvas" style="display:none;"></canvas>
                    <div class="photo-cam-actions">
                        <button type="button" class="btn-snap" onclick="captureWebPhoto()">📸 Jepret Foto</button>
                        <button type="button" class="btn-close-cam" onclick="closeWebCamera()">Batal</button>
                    </div>
                </div>

                <!-- Input penampung untuk hasil jepretan Kamera Browser -->
                <input type="file" id="webCamInput" accept="image/*" class="sr-only-input">

                <div id="fileStatus" class="file-status">Belum ada foto dipilih</div>
                <img id="previewFoto" alt="Preview Foto Barang">
            </div>

            <div class="form-group">
                <label>2. Scan Barcode / Input Manual (Barcode atau Article)</label>
                <div class="input-action-row">
                    <input type="text" id="plu" name="plu" inputmode="numeric" placeholder="Scan atau ketik Barcode / Article..." required>
                    <button type="button" class="btn-scan" onclick="startScanner()">📷 Scan</button>
                    <button type="button" class="btn-cek" onclick="cekProduk()">Cek</button>
                </div>
                <span class="hint">*Bisa scan kamera, scan alat barcode, atau ketik manual nomor Barcode / Article lalu klik Cek.</span>

                <div id="scanner-container">
                    <div id="reader"></div>
                    <button type="button" class="btn-stop-scan" onclick="stopScanner()">Tutup Kamera Scanner</button>
                </div>
            </div>

            <div class="form-group">
                <label>Title / Article (Otomatis)</label>
                <input type="text" id="titleArticle" class="readonly-bg" readonly placeholder="Otomatis terisi saat produk ditemukan">
            </div>

            <div class="form-group">
                <label>Nama Barang (Otomatis)</label>
                <input type="text" id="namaBarang" name="namaBarang" class="readonly-bg" readonly required>
            </div>

            <div class="form-group">
                <label>Harga Beli (LDC) - Otomatis</label>
                <input type="text" id="ldc" name="ldc" class="readonly-bg" readonly required>
            </div>

            <div class="form-group">
                <label>Harga Jual (RSP) - Otomatis</label>
                <input type="text" id="harga" name="harga" class="readonly-bg" readonly required>
            </div>

            <div class="form-group">
                <label>3. Expired Date (Kosongkan jika tidak ada)</label>
                <input type="date" name="expiredDate" id="expiredDate">
            </div>

            <div class="form-group">
                <label>4. Keterangan Rusak</label>
                <textarea name="keterangan" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label>5. Layak Jual?</label>
                <select name="layakJual">
                    <option value="Ya">Ya</option>
                    <option value="Tidak">Tidak</option>
                </select>
            </div>

            <div class="form-group">
                <label>6. Jenis Ajuan</label>
                <select name="jenisAjuan">
                    <option value="Write Off">Write Off</option>
                    <option value="Markdown">Markdown</option>
                </select>
            </div>

            <div class="form-group">
                <label>7. Nama Pengaju</label>
                <input type="text" name="namaPengaju" required>
            </div>
            <button type="submit" id="btnSubmit" class="btn-submit">Submit Laporan</button>
        </form>
    </div>
</div>

<script>
    let html5QrCode = null;
    let isProductValid = false;
    let hasPhotoSelected = false;
    let webCamStream = null;

    function setActiveFotoInput(activeId) {
        ["kameraInput", "galeriInput", "webCamInput"].forEach(id => {
            const el = document.getElementById(id);
            if (id === activeId) {
                el.setAttribute("name", "foto");
            } else {
                el.removeAttribute("name");
            }
        });
    }

    function handleFileSelect(input, source) {
        if (input.files && input.files[0]) {
            if (source === "kamera") {
                setActiveFotoInput("kameraInput");
            } else if (source === "galeri") {
                setActiveFotoInput("galeriInput");
            } else {
                setActiveFotoInput("webCamInput");
            }
            hasPhotoSelected = true;
            tampilkanPreview(input.files[0]);
        }
    }

    function tampilkanPreview(file) {
        const status = document.getElementById("fileStatus");
        const preview = document.getElementById("previewFoto");
        status.innerText = "Foto siap diupload: " + file.name;
        status.style.color = "green";
        status.style.fontWeight = "bold";

        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    // Kamera Web Langsung (Bypass Android Photo Picker)
    function openWebCamera() {
        stopScanner();
        const container = document.getElementById("photo-cam-container");
        const video = document.getElementById("photoVideo");

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        }).then(stream => {
            webCamStream = stream;
            video.srcObject = stream;
            container.style.display = "block";
            container.scrollIntoView({ behavior: "smooth", block: "center" });
        }).catch(err => {
            alert("Gagal membuka kamera browser: " + err);
        });
    }

    function captureWebPhoto() {
        const video = document.getElementById("photoVideo");
        const canvas = document.getElementById("photoCanvas");
        if (!video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            const fileName = "foto_barang_" + Date.now() + ".jpg";
            const file = new File([blob], fileName, { type: "image/jpeg" });

            const dt = new DataTransfer();
            dt.items.add(file);
            const webCamInput = document.getElementById("webCamInput");
            webCamInput.files = dt.files;

            handleFileSelect(webCamInput, "webcam");
            closeWebCamera();
        }, "image/jpeg", 0.85);
    }

    function closeWebCamera() {
        const container = document.getElementById("photo-cam-container");
        const video = document.getElementById("photoVideo");
        if (webCamStream) {
            webCamStream.getTracks().forEach(track => track.stop());
            webCamStream = null;
        }
        video.srcObject = null;
        container.style.display = "none";
    }

    document.getElementById("plu").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            cekProduk();
        }
    });

    function startScanner() {
        closeWebCamera();
        const container = document.getElementById("scanner-container");
        container.style.display = "block";
        container.scrollIntoView({ behavior: "smooth", block: "center" });

        setTimeout(() => {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            if (html5QrCode.isScanning) {
                return;
            }

            const config = {
                fps: 10,
                aspectRatio: 1.5,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    const width = Math.max(180, Math.floor(viewfinderWidth * 0.85));
                    const height = Math.max(100, Math.floor(viewfinderHeight * 0.45));
                    return { width: width, height: height };
                }
            };

            const onScanSuccess = (decodedText) => {
                document.getElementById("plu").value = decodedText.trim();
                stopScanner();
                cekProduk();
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                () => {}
            ).catch(() => {
                Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length > 0) {
                        const backCam = devices[devices.length - 1].id;
                        html5QrCode.start(backCam, config, onScanSuccess, () => {});
                    } else {
                        alert("Kamera tidak ditemukan pada perangkat ini.");
                        container.style.display = "none";
                    }
                }).catch(err => {
                    alert("Izin kamera ditolak atau browser tidak mendukung akses kamera: " + err);
                    container.style.display = "none";
                });
            });
        }, 150);
    }

    function stopScanner() {
        const container = document.getElementById("scanner-container");
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                container.style.display = "none";
            }).catch(() => {
                container.style.display = "none";
            });
        } else {
            container.style.display = "none";
        }
    }

    function cekProduk() {
        const kode = document.getElementById("plu").value.trim();
        if (!kode) return alert("Scan barcode atau masukkan Barcode / Article terlebih dahulu!");

        const btnCek = document.querySelector(".btn-cek");
        btnCek.innerText = "Mencari...";

        fetch('/api/cek-plu?plu=' + encodeURIComponent(kode))
            .then(res => res.json())
            .then(data => {
                btnCek.innerText = "Cek";
                isProductValid = data.found === true;

                document.getElementById("titleArticle").value = data.title || "-";
                document.getElementById("namaBarang").value = data.namaBarang;

                document.getElementById("harga").value = new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(data.harga || 0);

                document.getElementById("ldc").value = new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(data.ldc || 0);
            })
            .catch(() => {
                btnCek.innerText = "Cek";
                alert("Gagal mengambil data produk.");
            });
    }

    function validateAndDisableSubmit() {
        if (!hasPhotoSelected) {
            alert("Silakan ambil foto atau pilih foto barang rusak terlebih dahulu!");
            return false;
        }
        if (!isProductValid) {
            alert("Produk belum ditemukan! Pastikan Barcode atau Article sudah benar dan klik Cek terlebih dahulu.");
            return false;
        }
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.innerText = "Mengirim Laporan...";
        return true;
    }
</script>
</body>
</html>
